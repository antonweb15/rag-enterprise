[project]
name = "rag-enterprise"
version = "0.1.0"
description = "Modular enterprise RAG system (local / free-tier stack, Web widget / Telegram / REST-SSE, PostgreSQL + pgvector)."
readme = "README.md"
# The upper bound fixes the tested interpreter range and prevents a "silent" drift
# (CI is pinned to 3.11 - see .python-version and .github/workflows/ci.yml).
requires-python = ">=3.11,<3.15"

# Stage B introduces the storage layer: SQLAlchemy 2.0 (ORM/Core), Alembic (additive-only
# migrations, see storage_schema.md §5), psycopg 3 (Postgres driver) and pgvector
# (vector/sparsevec types for the dense/sparse arms of BGE-M3). Stage C adds the core contracts:
# Pydantic V2 (domain models / Base* interfaces) and pydantic-settings (the Settings object,
# see modules_spec.md §1). The rest of the application stack (ingestion/retrieval/LLM) will
# appear in later stages.
dependencies = [
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
# Stage D (Ingestion Pipeline & Embedder, core/architecture.md §3). These heavy runtime
# dependencies power the concrete providers (Docling parser, BGE-M3 embedder, S3 storage, the
# Taskiq Postgres queue). They are imported LAZILY in rag_core.ingestion, so the core package and
# its unit tests work without them installed; install this extra to run a real ingest worker.
ingestion = [
    "docling>=2.0",
    "FlagEmbedding>=1.2",
    "taskiq-pg>=0.1",
    "boto3>=1.34",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # RLS security integration contract tests (storage_schema.md §4, eval_and_ops.md §1.3)
    # run against a real Postgres+pgvector via testcontainers. When Docker is absent the
    # corresponding tests are marked skipped (see tests/integration/conftest.py).
    "testcontainers[postgres]>=4.0",
]

# PEP 517/518 build backend. In Phase 1-2 the wheel is not built (CI runs only
# ruff/mypy/pytest); the section is declared for a correct editable install
# (`pip install -e .[dev]`) and reproducible tooling.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ----------------------------------------------------------------------------
# Backend toolchain (core/eval_and_ops.md §3.6). The canonical way to install
# dev dependencies is `pip install -e ".[dev]"` (source - [project.optional-dependencies].dev,
# also used in CI). `uv` is supported as an optional alternative
# (`uv sync --extra dev`); no separate dependency lists are maintained for uv -
# to avoid duplicating the dev set. `.python-version` (3.11) fixes the target
# interpreter; CI is pinned to the same (setup-python 3.11).
# ----------------------------------------------------------------------------

# Only the `rag_core` core from packages/ is installed (see [tool.setuptools.packages.find]).
# The transport layer `services/` is not packaged into the wheel in Stage A (it runs from the
# repo root via pythonpath, cf. the docker commands `uvicorn services.api.*` in eval_and_ops.md §3.2).
[tool.setuptools]
py-modules = []

# packages/rag_core - pip-installable core (`pip install -e .[dev]`): sources live
# in the packages/ directory, so we declare it as package-dir and enable auto-discovery.
[tool.setuptools.packages.find]
where = ["packages"]

# PEP 561: the `py.typed` typing marker must be included in the distribution, otherwise mypy
# at consumers will not see the `rag_core` types.
[tool.setuptools.package-data]
rag_core = ["py.typed"]

# ----------------------------------------------------------------------------
# Ruff - linter and formatter
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["tests", "packages", "services"]
# The core Markdown documents (core/*.md, SPECIFICATION.md) contain ILLUSTRATIVE
# DDL/Pydantic/pseudo-code in fenced blocks. Since ruff 0.16 `ruff format` and
# `ruff check` process such blocks, breaking CI (`ruff format --check .`).
# Documentation is not executable code, so we exclude it from ruff's scope.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# The migrations carry the canonical DDL VERBATIM from core/storage_schema.md (source of truth).
# Long lines inside SQL literals (CHECK feature allowlist, composite CREATE INDEX) are not
# wrapped, to preserve the verbatim match with the specification.
"packages/rag_core/db/migrations/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
# The transport-layer skeleton services/ is present (services/api) - we treat it as first-party
# alongside the rag_core core, so isort groups internal imports correctly.
known-first-party = ["rag_core", "services", "packages"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------------------------------------------------------------
# Mypy - static typing
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "packages"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
# Stage C: the pydantic V2 mypy plugin teaches mypy the synthesized model `__init__`
# (so `Field(None, ...)` is understood as an optional field with a default, not a required arg).
plugins = ["pydantic.mypy"]
# DI-by-port is the core architecture (modules_spec.md §2): the container binds ABSTRACT ports
# (Base* ABCs) to providers, so `type[BaseX]` is passed intentionally to register/resolve. The
# `type-abstract` check would flag exactly this legitimate pattern. It is disabled GLOBALLY (not
# only for packages/rag_core/di/) on purpose: the error surfaces at every CALL SITE that passes
# an abstract port (tests and future composition roots), not inside the container module, so a
# per-module override scoped to di/ would not actually suppress it.
disable_error_code = ["type-abstract"]
# The core, the transport layer and the tests are typed (cf. core/eval_and_ops.md §4 -
# the target `mypy services/ packages/`).
files = ["tests", "packages", "services"]

# Stage D (core/architecture.md §3): the ingestion providers depend on heavy, optional runtime
# libraries (Docling, FlagEmbedding, boto3, taskiq-pg) that are imported LAZILY and ship no type
# stubs. They are declared in the optional `ingestion` extra and are absent in the lint/type/test
# environment, so we silence "missing import" for exactly these modules (the lazy import sites are
# unreachable without the extra installed).
[[tool.mypy.overrides]]
module = [
    "docling.*",
    "FlagEmbedding.*",
    "boto3.*",
    "taskiq_pg.*",
]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# packages/ - for import rag_core; "." - for import services.api (transport-layer skeleton).
pythonpath = ["packages", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
# Explicitly fix the event-loop fixture scope (removes the pytest-asyncio deprecation warning
# and makes behavior stable on a future default change / running with `-W error`).
asyncio_default_fixture_loop_scope = "function"

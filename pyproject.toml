[project]
name = "rag-enterprise"
version = "0.1.0"
description = "Модульная корпоративная RAG-система (локальный / free-tier стек, Web-виджет / Telegram / REST-SSE, PostgreSQL + pgvector)."
readme = "README.md"
requires-python = ">=3.11"

# Прикладные зависимости появятся в Фазе 3+ (реализация рантайма).
# На текущей стадии (Фаза 1–2) зафиксированы только dev-инструменты качества кода.
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

# ----------------------------------------------------------------------------
# Ruff — линтер и форматтер
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
# По мере появления прикладного кода добавятся каталоги services/ packages/.
src = ["tests", "services", "packages"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["rag_core", "services", "packages"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------------------------------------------------------------
# Mypy — статическая типизация
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
# На Фазе 1–2 типизируется только tests/; в Фазе 3+ сюда добавятся services/ packages/
# (ср. core/eval_and_ops.md §4 — целевой `mypy services/ packages/`).
files = ["tests"]

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"

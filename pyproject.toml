[project]
name = "rag-enterprise"
version = "0.1.0"
description = "Модульная корпоративная RAG-система (локальный / free-tier стек, Web-виджет / Telegram / REST-SSE, PostgreSQL + pgvector)."
readme = "README.md"
requires-python = ">=3.11"

# Прикладные зависимости появятся в Фазе 3+ (реализация рантайма).
# На текущей стадии (Фаза 1–2) зафиксированы только dev-инструменты качества кода.
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

# PEP 517/518 build backend. На Фазе 1–2 сборка wheel не выполняется (CI гоняет
# только ruff/mypy/pytest), секция объявлена для корректной установки в editable-режиме
# (`pip install -e .[dev]`) и воспроизводимого тулинга.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# На Фазе 1–2 устанавливаемых пакетов ещё нет (код живёт в packages/ как исходники,
# подключаемые через pythonpath/mypy_path). Явно отключаем авто-обнаружение пакетов
# setuptools, чтобы `pip install -e .[dev]` не падал на «Multiple top-level packages».
[tool.setuptools]
py-modules = []

# ----------------------------------------------------------------------------
# Ruff — линтер и форматтер
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
# По мере появления прикладного кода каталог services/ добавится в src.
src = ["tests", "packages"]
# Markdown-документы ядра (core/*.md, SPECIFICATION.md) содержат ИЛЛЮСТРАТИВНЫЙ
# DDL/Pydantic/pseudo-код в fenced-блоках. Начиная с ruff 0.16 `ruff format` и
# `ruff check` обрабатывают такие блоки, ломая CI (`ruff format --check .`).
# Документация не является исполняемым кодом, поэтому исключаем её из области ruff.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
# services/ пока не существует в src (убран вместе с forward-ref) — вернётся в Фазе 3+ вместе с кодом.
known-first-party = ["rag_core", "packages"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------------------------------------------------------------
# Mypy — статическая типизация
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "packages"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
# На Фазе 1–2 типизируется только tests/; в Фазе 3+ сюда добавятся services/ packages/
# (ср. core/eval_and_ops.md §4 — целевой `mypy services/ packages/`).
files = ["tests"]

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["packages"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"

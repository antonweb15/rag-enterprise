# Alembic config (Stage B - migrations, core/storage_schema.md §5).
# A single migration tool on top of SQLAlchemy 2.0 (the same chain also for Supabase hosting).
# The URL is taken from the POSTGRES_DSN environment variable (admin/migrations, role
# service_role/postgres), and NOT from this file - so DSN and secrets are not committed to git
# (see env.py).

[alembic]
script_location = packages/rag_core/db/migrations
prepend_sys_path = packages:.
path_separator = os
# sqlalchemy.url is intentionally empty: the real DSN is injected in env.py from POSTGRES_DSN.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

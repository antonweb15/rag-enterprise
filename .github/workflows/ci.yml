name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel stale runs on the same ref (save runners).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Two independent pipelines (back / front) with separate dependency caches
# (core/eval_and_ops.md §3.6).
jobs:
  backend:
    name: Backend - Lint, Format, Types, Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # No `|| echo ok`: every step must fail on error.
      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy

      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend - Type-check & Build (pnpm workspaces)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Take the pnpm version from the `packageManager` field in package.json (pnpm@9.x).
      # Do NOT specify `version:` here - otherwise the action fails with "Multiple versions
      # of pnpm specified" (conflict between the input and packageManager).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The pnpm cache is enabled after committing pnpm-lock.yaml (`cache: pnpm` requires the
      # lock file to be committed; before that - a clean install so the step does not fail on a cache miss).
      - name: Install workspace deps
        run: pnpm install --no-frozen-lockfile

      # Real checks (NOT echo stubs): tsc --noEmit (lint) + Vite build.
      - name: Type-check (lint)
        run: pnpm -r lint

      - name: Build
        run: pnpm -r build

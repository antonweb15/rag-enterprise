name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel stale runs on the same ref (save runners).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Two independent pipelines (back / front) with separate dependency caches
# (core/eval_and_ops.md §3.6).
jobs:
  backend:
    name: Backend - Lint, Format, Types, Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # No `|| echo ok`: every step must fail on error.
      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy

      - name: Pytest
        run: pytest -q

      # Stage J quality gate (IMPLEMENTATION_PLAN.md Stage J, core/eval_and_ops.md §1/§4).
      # The offline self-check always runs as a smoke of the gate plumbing (no infra needed) and
      # blocks the merge if the gate itself regresses.
      - name: Evaluation gate - offline self-check (smoke)
        run: python -m tests.eval_ragas --self-check --json-report eval-report-selfcheck.json

      # The LIVE LLM-judged RAGAS/IR gate runs only when the eval infrastructure is configured
      # (repo variable RUN_EVAL_GATE=1 + the secrets/vars below). It installs the `eval` extra so
      # the real `ragas` scorer is used (not the heuristic fallback), seeds the golden corpus so the
      # QRELS chunk ids exist, runs a small smoke first, then the full gate - blocking the merge on
      # any quality degradation.
      - name: Install eval extra (RAGAS) + seed the golden corpus
        if: vars.RUN_EVAL_GATE == '1'
        env:
          POSTGRES_DSN: ${{ secrets.EVAL_POSTGRES_DSN }}
          POSTGRES_APP_DSN: ${{ secrets.EVAL_POSTGRES_APP_DSN }}
        run: |
          pip install -e ".[eval,ingestion,retrieval]"
          python -m tests.eval_ragas.seed_corpus \
            --tenant-id "${{ vars.EVAL_TENANT_ID }}" --user-id "${{ vars.EVAL_USER_ID }}"

      - name: Evaluation gate - live RAGAS/IR (blocks merge on regression)
        if: vars.RUN_EVAL_GATE == '1'
        env:
          POSTGRES_DSN: ${{ secrets.EVAL_POSTGRES_DSN }}
          POSTGRES_APP_DSN: ${{ secrets.EVAL_POSTGRES_APP_DSN }}
          GROQ_API_KEY: ${{ secrets.EVAL_GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.EVAL_GEMINI_API_KEY }}
        run: |
          python -m tests.eval_ragas --smoke \
            --tenant-id "${{ vars.EVAL_TENANT_ID }}" --user-id "${{ vars.EVAL_USER_ID }}" \
            --json-report eval-report-smoke.json
          python -m tests.eval_ragas \
            --tenant-id "${{ vars.EVAL_TENANT_ID }}" --user-id "${{ vars.EVAL_USER_ID }}" \
            --json-report eval-report.json

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: eval-report*.json
          if-no-files-found: ignore

  frontend:
    name: Frontend - Type-check & Build (pnpm workspaces)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Take the pnpm version from the `packageManager` field in package.json (pnpm@9.x).
      # Do NOT specify `version:` here - otherwise the action fails with "Multiple versions
      # of pnpm specified" (conflict between the input and packageManager).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The pnpm cache is enabled after committing pnpm-lock.yaml (`cache: pnpm` requires the
      # lock file to be committed; before that - a clean install so the step does not fail on a cache miss).
      - name: Install workspace deps
        run: pnpm install --no-frozen-lockfile

      # Real checks (NOT echo stubs): tsc --noEmit (lint) + Vite build.
      - name: Type-check (lint)
        run: pnpm -r lint

      - name: Build
        run: pnpm -r build
